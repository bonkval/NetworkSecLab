<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <h1>Sign in</h1>
        <p class="subtitle">Enter your account details</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" maxlength="254" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" maxlength="256" required>

            <button type="submit">Login</button>
        </form>
    </main>
</body>
</html>
