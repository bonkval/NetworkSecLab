name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt pytest pytest-cov ruff
      - run: ruff check app monitor network security tests server.py start.py
      - run: pytest --cov=app --cov=monitor --cov=network --cov=security --cov-report=term-missing
